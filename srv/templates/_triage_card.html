{{define "triage-card"}}
<div class="triage-card{{if eq .LastUpdater "client"}} needs-response{{end}}"
     id="ticket-{{.ID}}">
  <div class="triage-card-main">
    <span class="badge badge-status-{{.Status}}">{{.StatusLabel}}</span>
    <a class="ticket-subject" href="/ticket/{{.ID}}"><span class="ticket-number">#{{.ID}}</span> {{.Subject}}</a>
    <span class="ticket-company">{{.CompanyName}}</span>
  </div>
  <div class="triage-card-meta">
    <span class="ticket-time">{{.TimeSince}}</span>
    <span class="ticket-updater">{{if eq .LastUpdater "client"}}<i data-lucide="user"></i> Client waiting{{else}}<i data-lucide="building-2"></i> Agent replied{{end}}</span>
  </div>
  <div class="triage-card-actions">
    <button class="btn btn-triage btn-triage-today"
            hx-put="/ticket/{{.ID}}/state"
            hx-vals='{"field": "today", "value": "1", "from": "triage"}'
            hx-target="#ticket-{{.ID}}"
            hx-swap="outerHTML swap:150ms"><i data-lucide="star"></i> Today</button>
    <button class="btn btn-triage btn-triage-queue"
            hx-put="/ticket/{{.ID}}/state"
            hx-vals='{"field": "priority", "value": "1", "from": "triage"}'
            hx-target="#ticket-{{.ID}}"
            hx-swap="outerHTML swap:150ms"><i data-lucide="pin"></i> Queue</button>
    <button class="btn btn-triage btn-triage-blocked"
            hx-put="/ticket/{{.ID}}/state"
            hx-vals='{"field": "blocked", "value": "1", "from": "triage"}'
            hx-target="#ticket-{{.ID}}"
            hx-swap="outerHTML swap:150ms"><i data-lucide="ban"></i> Blocked</button>
    <button class="btn btn-triage btn-triage-dismiss"
            hx-put="/ticket/{{.ID}}/state"
            hx-vals='{"field": "dismiss", "value": "1", "from": "triage"}'
            hx-target="#ticket-{{.ID}}"
            hx-swap="outerHTML swap:150ms"><i data-lucide="check"></i> Dismiss</button>
  </div>
</div>
{{end}}
