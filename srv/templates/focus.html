{{template "layout" .}}

{{define "content"}}
<div class="today">
  <header class="page-header">
    <div class="page-header-row">
      <h1><i data-lucide="star"></i> Today</h1>
      {{template "filter-bar"}}
    </div>
    <p class="page-subtitle"><span id="count-total">{{len .Tickets}}</span> tickets for today</p>
  </header>

  {{if .Tickets}}
  <div class="ticket-list">
    {{range .Tickets}}{{template "ticket-card" .}}{{end}}
  </div>
  {{else}}
  <div class="empty-state">
    <p>No tickets flagged for today.</p>
    <p>Use the <i data-lucide="star"></i> button on the <a href="/">dashboard</a> to flag tickets.</p>
  </div>
  {{end}}
</div>
{{end}}
